<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">

    <!-- Login -->
    <section id="login" class="screen">
      <div class="login-box">
        <h1>IPTV Player</h1>
        <p class="muted">Enter your Xtream Codes login. It is saved only on this TV.</p>
        <label>Server URL<input id="in-server" class="field" type="url" placeholder="http://example.com:8080" autocomplete="off"></label>
        <label>Username<input id="in-user" class="field" type="text" autocomplete="off" autocapitalize="off"></label>
        <label>Password<input id="in-pass" class="field" type="password" autocomplete="off"></label>
        <button id="btn-login" class="field btn">Connect</button>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <!-- Browse -->
    <section id="browse" class="screen">
      <header id="tabs">
        <div class="tab" data-section="live">Live TV</div>
        <div class="tab" data-section="vod">Movies</div>
        <div class="tab" data-section="series">Series</div>
        <div class="tab" data-section="info">Info</div>
        <div id="clock"></div>
      </header>
      <div id="browse-body">
        <nav id="cats"></nav>
        <main id="content">
          <div id="content-head">
            <div id="content-title"></div>
            <input id="search" type="text" placeholder="Search this section…" autocomplete="off">
          </div>
          <div id="grid"></div>
          <div id="detail"></div>
          <div id="info"></div>
        </main>
      </div>
    </section>

    <!-- Series detail -->
    <section id="series" class="screen">
      <div id="series-head">
        <img id="series-cover" alt="">
        <div>
          <h1 id="series-title"></h1>
          <p id="series-meta" class="muted"></p>
          <p id="series-plot"></p>
        </div>
      </div>
      <div id="series-body">
        <nav id="seasons"></nav>
        <div id="episodes"></div>
      </div>
    </section>

    <!-- Player -->
    <section id="player" class="screen">
      <video id="video" autoplay playsinline></video>
      <div id="osd">
        <div id="osd-title"></div>
        <div id="osd-sub"></div>
        <div id="osd-progress"><div id="osd-bar"></div></div>
        <div id="osd-time"></div>
        <div id="osd-hint" class="muted"></div>
      </div>
      <div id="player-msg"></div>
    </section>

    <div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>
    <div id="toast"></div>
  </div>

  <script src="js/xtream.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
